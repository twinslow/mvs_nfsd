# nfsd.conf - NFS server export configuration
#
# Format: one PDS dataset per line
#   <nfs-export-path>  <pds-dataset-name>
#
# Multiple lines with the SAME export path group several PDS datasets
# under one export.  Each dataset appears as a directory (the lower-case
# form of the dataset name) under the export root; its members appear as
# files inside that directory.
#
# Lines beginning with # are comments.  Blank lines are ignored.
# Up to 16 exports, 32 datasets per export.
#
# Example: one export "/export" containing three PDS datasets, seen by
# clients as /export/temp.testproj.jcllib, /export/temp.testproj.cntl,
# and /export/temp.testproj.loadlib.
/export    TEMP.TESTPROJ.JCLLIB
/export    TEMP.TESTPROJ.CNTL
/export    TEMP.TESTPROJ.LOADLIB


