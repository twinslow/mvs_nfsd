# nfsd.conf - NFS server configuration
#
# The file is sectioned, Windows .ini style:
#
#   [SectionName]
#   ...lines belonging to that section...
#
# Section names are case-insensitive.  Lines beginning with # are comments;
# blank lines are ignored.  Lines appearing BEFORE any section header are
# treated as [Exports], so older (section-less) config files still work.
#
# See doc/readme_config.md for the full reference.


# ---------------------------------------------------------------------
# [Init] - startup commands
#
# Each line is an operator command, run at startup exactly as if it had
# been typed at the MVS console via MODIFY:
#
#   F NFSD,SET LOGLVL DEBUG PROC=WRITE
#
# so anything valid after "F NFSD," is valid here.  Commands are applied
# in file order, before the sections that follow.
# ---------------------------------------------------------------------
[Init]

# Global log level for the log stream (DEBUG|TRACE|INFO|WARN|ERROR|FATAL).
set loglvl info

# Turn a single NFS procedure up without making everything else noisy.
#set loglvl debug proc=write
#set loglvl debug proc=read

# Console (WTO) level.  The console is a subset of the log stream, so the
# effective console floor is max(loglvl, wtolvl).
#set wtolvl info


# ---------------------------------------------------------------------
# [Exports] - exported PDS datasets
#
# Format: one PDS dataset per line
#   <nfs-export-path>  <pds-dataset-name>  [keywords...]
#
# Multiple lines with the SAME export path group several PDS datasets
# under one export.  Each dataset appears as a directory (the lower-case
# form of the dataset name) under the export root; its members appear as
# files inside that directory.
#
# Keywords (case-insensitive, any order); see doc/readme_config.md:
#   ro                - read-only: refuse all writes (enforced even for root)
#   rw                - read-write (the default)
#   dirperm=<octal>   - mode reported for the PDS directory   (default 777)
#   memperm=<octal>   - mode reported for its members         (default 777)
#   rootperm=<octal>  - mode reported for the export root, block form only
#                       (default 555; the root is always read-only)
#   fileext=<ext>     - file extension shown for members, overriding the
#                       one derived from the dataset name (default: last
#                       qualifier, lower-cased).  Bare, no dot, no quotes.
#   nofileext         - show members with NO extension at all (counterpart
#                       to fileext=; the two cannot appear together)
#
# Up to 16 exports, 32 datasets per export.  A bad keyword or value fails
# the whole export (fail-closed).
# ---------------------------------------------------------------------
[Exports]

# One export "/exports" containing three PDS datasets, seen by clients as
# /exports/temp.testproj.c, /exports/temp.testproj.cntl, and
# /exports/temp.testproj.jcllib.
/exports    TEMP.TESTPROJ.C
/exports    TEMP.TESTPROJ.CNTL
/exports    TEMP.TESTPROJ.JCLLIB

# Read-only reference copy with conventional permissions (flat form):
#/pub        SYS1.MACLIB          ro dirperm=555 memperm=444

# fileext overrides the dsname-derived extension -- e.g. present CNTL and
# JCLLIB datasets as *.jcl so clients open them with a JCL-aware editor:
#/exports    TEMP.TESTPROJ.CNTL   fileext=jcl dirperm=777 memperm=666
#/exports    TEMP.TESTPROJ.JCLLIB fileext=jcl dirperm=777 memperm=666
#/exports    SYS2.JCLLIB          fileext=jcl ro

# nofileext shows members by their bare name (no extension) -- e.g. SAMPLIB
# members appear as "iefbr14", not "iefbr14.samplib":
#/exports    SYS1.SAMPLIB         nofileext ro

# Block form -- one keyword set for the whole export, plus rootperm:
#/ro  ro rootperm=555 dirperm=555 memperm=444 {
#    SYS1.PROCLIB
#    SYS1.MACLIB     memperm=400
#}

# Block form with a per-dataset file extension:
#/exports/tonyw/library {
#    TONYW.LIBRARY.CNTL      fileext=jcl
#    TONYW.LIBRARY.C         fileext=c
#    TONYW.LIBRARY.H         fileext=h
#}
