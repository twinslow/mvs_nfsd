# nfsd.conf - NFS server export configuration
#
# Format: one export per line
#   <nfs-export-path>  <local-host-path>
#
# Lines beginning with # are comments.
# Blank lines are ignored.
# Up to 16 exports supported.
#
# Example exports:
/export/src    /home/tony_/src
/export/data   /home/tony_/data


